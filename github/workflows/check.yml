name: Check flight prices

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes, 24/7 (GitHub may delay runs by a few minutes)
  workflow_dispatch: {}       # lets you press "Run workflow" to check right now

permissions:
  contents: write

concurrency:
  group: fare-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check fares
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 checker/check.py

      - name: Save price history
        run: |
          git config user.name "fare-watch-bot"
          git config user.email "fare-watch-bot@users.noreply.github.com"
          git add docs/data/history.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Fare check $(TZ=Asia/Kolkata date '+%d %b %H:%M IST')"
            git pull --rebase --autostash || true
            git push
          fi
